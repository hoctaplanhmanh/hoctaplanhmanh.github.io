<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận Vía Đỗ NV1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #2d1b4e 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            width: 450px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #e2e8f0;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 35px;
        }
        .btn-start {
            display: inline-block;
            text-decoration: none;
            padding: 16px 38px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 0.5px;
        }
        .btn-start:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 65, 108, 0.6);
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
        }
        .btn-start:active {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tốt Nghiệp THPT 2026 🎓</h1>
        <p>Đại học ngay trước mắt rồi ae</p>
        <a href="loichuc.html" class="btn-start">BẤM VÀO ĐÂY AE </a>
    </div>

</body>
</html>
