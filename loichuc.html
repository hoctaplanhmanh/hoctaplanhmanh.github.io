<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời Chúc Từ Vũ Trụ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .wish-box {
            text-align: center;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            padding: 55px 45px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            width: 550px;
            position: relative;
            animation: scaleUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes scaleUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #f355da);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .content {
            font-size: 18px;
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 35px;
        }
        .highlight {
            color: #f43f5e;
            font-weight: bold;
            font-size: 20px;
        }
        .back-btn {
            display: inline-block;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .back-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="wish-box">
        <h1>✨ CHÚC AE ĐỖ NV1 ✨</h1>
        <div class="content">
            <p>Chúc ae: <span class="highlight">100% ĐỖ ĐẠI HỌC!</span> </p>
            <p>Chúc ae bước vào phòng thi thật bình tĩnh, làm bài mượt ko sai ngu, 27+, đỗ nv1 vào trường mình mơ ước nhé <br>
              HUST HUCE HAUI FTP gọi ae
            </p>
        </div>
        <a href="index.html" class="back-btn">← Quay lại</a>
    </div>

</body>
</html>
